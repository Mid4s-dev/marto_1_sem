{% extends "base.html" %}
{% block title %}Add Tenant{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3"><i class="bi bi-person-badge me-2"></i>Create Tenant Account</h2>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control"
              placeholder="tenant@example.com" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Temporary Password</label>
            <input type="password" name="password" class="form-control"
              minlength="8" required />
            <div class="form-text">Minimum 8 characters. Tenant should change on first login.</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">
              <i class="bi bi-person-check"></i> Create Account
            </button>
            <a href="{{ url_for('property.caretaker_dashboard') }}" class="btn btn-outline-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
