{% extends "base.html" %}
{% block title %}Assign Lease{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h2 class="mb-3"><i class="bi bi-person-plus me-2"></i>Assign Lease</h2>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Tenant</label>
            <select name="tenant_id" class="form-select" required>
              <option value="">— Select tenant —</option>
              {% for t in tenants %}
              <option value="{{ t.user_id }}">{{ t.email }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Vacant Unit</label>
            <select name="unit_id" class="form-select" required>
              <option value="">— Select unit —</option>
              {% for u in units %}
              <option value="{{ u.unit_id }}">{{ u.unit_number }} — KES {{ "%.2f"|format(u.monthly_rent|float) }}/mo</option>
              {% endfor %}
            </select>
            {% if not units %}
            <div class="form-text text-danger">No vacant units available.</div>
            {% endif %}
          </div>
          <div class="mb-3">
            <label class="form-label">Lease Start Date</label>
            <input type="date" name="start_date" class="form-control" required />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark"
              {{ 'disabled' if not units }}>
              <i class="bi bi-check-lg"></i> Assign
            </button>
            <a href="{{ url_for('property.caretaker_dashboard') }}" class="btn btn-outline-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
