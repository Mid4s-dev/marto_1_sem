{% extends "base.html" %}
{% block title %}Add Charge{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3"><i class="bi bi-plus-circle me-2"></i>Add Charge</h2>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Lease / Tenant</label>
            <select name="lease_id" class="form-select" required>
              <option value="">— Select active lease —</option>
              {% for l in leases %}
              <option value="{{ l.lease_id }}">
                {{ l.tenant.email }} — Unit {{ l.unit.unit_number }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Charge Type</label>
            <input type="text" name="charge_type" class="form-control"
              placeholder="e.g. Monthly Rent, Water Bill, Penalty" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (KES)</label>
            <input type="number" name="amount" class="form-control"
              step="0.01" min="1" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" name="due_date" class="form-control" required />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">
              <i class="bi bi-save"></i> Add Charge
            </button>
            <a href="{{ url_for('property.caretaker_dashboard') }}" class="btn btn-outline-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
